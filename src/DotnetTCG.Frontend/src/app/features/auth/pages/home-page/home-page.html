<main class="auth-page" [style.background-image]="backgroundImage()">
  <section class="auth-card">
    <img class="auth-logo" src="/pokemonTcg_logo.png" alt="Pokemon TCG" />
    <h1 class="auth-title">Pokemon TCG</h1>
    <p class="auth-subtitle">Bienvenido. Elige como quieres continuar.</p>

    <div class="auth-actions">
      <button class="auth-btn" routerLink="/iniciar-sesion" type="button">Iniciar Sesion</button>
      <button class="auth-btn" routerLink="/crear-usuario" type="button">Crear Usuario</button>
    </div>
  </section>
</main>
