<main class="auth-page" [style.background-image]="backgroundImage()">
  <section class="auth-card">
    <img class="auth-logo" src="/pokemonTcg_logo.png" alt="Pokemon TCG" />
    <h1 class="auth-title">Iniciar Sesion</h1>

    @if (requestError()) {
      <div class="auth-message error">{{ requestError() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-field">
        <label for="usernameOrEmail">Usuario o Email</label>
        <input id="usernameOrEmail" type="text" formControlName="usernameOrEmail" />
        @if (showControlError('usernameOrEmail')) {
          <p class="auth-error">Ingresa tu usuario o email.</p>
        }
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" />
        @if (showControlError('password')) {
          <p class="auth-error">Ingresa tu contraseña.</p>
        }
      </div>

      <a class="auth-link" routerLink="/recuperar-contrasena">Olvide mi contraseña</a>

      <div class="auth-actions">
        <button class="auth-btn" type="submit" [disabled]="isSubmitting()">Iniciar Sesion</button>
      </div>
    </form>

    <a class="auth-link auth-centered-link" routerLink="/crear-usuario">Crear Cuenta</a>
    <a class="auth-link auth-centered-link" routerLink="/inicio">Volver a Inicio</a>
  </section>
</main>
