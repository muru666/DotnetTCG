<main class="auth-page" [style.background-image]="backgroundImage()">
  <ui-panel padding="lg" class="auth-panel">
    <img class="auth-logo" src="/pokemonTcg_logo.png" alt="Pokemon TCG" />
    <h1 class="auth-title">Recuperar Contraseña</h1>

    @if (successMessage()) {
      <ui-callout variant="success">{{ successMessage() }}</ui-callout>
    }
    @if (requestError()) {
      <ui-callout variant="error">{{ requestError() }}</ui-callout>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <ui-form-field label="Ingresar Email" fieldId="email"
        [error]="showControlError('email') ? 'Ingresa un email valido.' : null">
        <input id="email" type="email" formControlName="email"
          [attr.aria-invalid]="showControlError('email') ? true : null"
          [attr.aria-describedby]="showControlError('email') ? 'email-error' : null" />
      </ui-form-field>

      <div class="auth-stack">
        <ui-button type="submit" [loading]="isSubmitting()"
          [disabled]="isSubmitting() || resendSeconds() > 0">
          @if (resendSeconds() > 0) {
            Reenviar en {{ resendSeconds() }}s
          } @else {
            Enviar Correo
          }
        </ui-button>
      </div>
    </form>

    <a class="auth-link auth-centered-link" routerLink="/cambiar-contrasena">Ya tengo mi codigo</a>
    <a class="auth-link auth-centered-link" routerLink="/iniciar-sesion">Recorde mi Contraseña</a>
  </ui-panel>
</main>
