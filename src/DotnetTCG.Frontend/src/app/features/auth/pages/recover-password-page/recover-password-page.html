<main class="auth-page" [style.background-image]="backgroundImage()">
  <section class="auth-card">
    <img class="auth-logo" src="/pokemonTcg_logo.png" alt="Pokemon TCG" />
    <h1 class="auth-title">Recuperar Contraseña</h1>

    @if (successMessage()) {
      <div class="auth-message success">{{ successMessage() }}</div>
    }

    @if (requestError()) {
      <div class="auth-message error">{{ requestError() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-field">
        <label for="email">Ingresar Email</label>
        <input id="email" type="email" formControlName="email" />
        @if (showControlError('email')) {
          <p class="auth-error">Ingresa un email valido.</p>
        }
      </div>

      <div class="auth-actions">
        <button class="auth-btn" type="submit" [disabled]="isSubmitting() || resendSeconds() > 0">
          @if (resendSeconds() > 0) {
            Reenviar en {{ resendSeconds() }}s
          } @else {
            Enviar Correo
          }
        </button>
      </div>
    </form>

    <a class="auth-link auth-centered-link" routerLink="/cambiar-contrasena">Ya tengo mi codigo</a>
    <a class="auth-link auth-centered-link" routerLink="/iniciar-sesion">Recorde mi Contraseña</a>
  </section>
</main>
