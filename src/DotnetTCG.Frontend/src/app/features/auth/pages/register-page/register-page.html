<main class="auth-page" [style.background-image]="backgroundImage()">
  <ui-panel padding="lg" class="auth-panel">
    <img class="auth-logo" src="/pokemonTcg_logo.png" alt="Pokemon TCG" />
    <h1 class="auth-title">Crear Usuario</h1>

    @if (requestError()) {
      <ui-callout variant="error">{{ requestError() }}</ui-callout>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <ui-form-field label="Nombre de Usuario" fieldId="username"
        [error]="showControlError('username') ? usernameErrorMessage() : null">
        <input id="username" type="text" formControlName="username"
          [attr.aria-invalid]="showControlError('username') ? true : null"
          [attr.aria-describedby]="showControlError('username') ? 'username-error' : null" />
      </ui-form-field>

      <ui-form-field label="Email" fieldId="email"
        [error]="showControlError('email') ? emailErrorMessage() : null">
        <input id="email" type="email" formControlName="email"
          [attr.aria-invalid]="showControlError('email') ? true : null"
          [attr.aria-describedby]="showControlError('email') ? 'email-error' : null" />
      </ui-form-field>

      <ui-form-field label="Contraseña" fieldId="password"
        [error]="showControlError('password') ? passwordErrorMessage() : null">
        <input id="password" type="password" formControlName="password"
          [attr.aria-invalid]="showControlError('password') ? true : null"
          [attr.aria-describedby]="showControlError('password') ? 'password-error' : null" />
      </ui-form-field>

      <ui-form-field label="Confirmar Contraseña" fieldId="confirmPassword"
        [error]="(showControlError('confirmPassword') || form.hasError('passwordMismatch')) ? confirmPasswordErrorMessage() : null">
        <input id="confirmPassword" type="password" formControlName="confirmPassword"
          [attr.aria-invalid]="(showControlError('confirmPassword') || form.hasError('passwordMismatch')) ? true : null"
          [attr.aria-describedby]="(showControlError('confirmPassword') || form.hasError('passwordMismatch')) ? 'confirmPassword-error' : null" />
      </ui-form-field>

      <div class="auth-stack">
        <ui-button type="submit" [loading]="isSubmitting()">Crear</ui-button>
      </div>
    </form>

    <a class="auth-link auth-centered-link" routerLink="/iniciar-sesion">Iniciar Sesion</a>
    <a class="auth-link auth-centered-link" routerLink="/inicio">Volver a Inicio</a>
  </ui-panel>
</main>
